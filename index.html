<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trama Pasta Fresca · Baixa, Lisboa</title>
<meta name="description" content="Pasta fresca feita à mão na Baixa de Lisboa. Chef Kelvin Muñoz. Rua da Vitória 28." />
<meta name="theme-color" content="#6B1C22" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
:root{--wine:#6B1C22;--wine-deep:#4A1218;--wine-soft:#8A2A32;--gold:#c4b07a;--cream:#f4eed8;--white:#fffcf4;--ink:#2a1816;--muted:#5c5048}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Outfit,system-ui,sans-serif;background:var(--cream);color:var(--ink);font-weight:300;line-height:1.55}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 28px;height:72px;background:var(--wine);color:var(--cream)}
.nav-links{display:flex;gap:22px;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.nav-links a{opacity:.88}
.brand{text-align:center}
.brand strong{display:block;font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:500;letter-spacing:.28em}
.brand small{display:block;font-size:9px;letter-spacing:.32em;opacity:.75}
.nav-right{display:flex;align-items:center;gap:12px}
.lang{display:flex;border:1px solid rgba(244,238,216,.35);border-radius:999px;overflow:hidden}
.lang button{background:transparent;border:0;color:var(--cream);padding:6px 10px;font-size:11px}
.lang button.on{background:var(--cream);color:var(--wine)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;border:1px solid var(--cream);background:var(--cream);color:var(--wine);transition:.2s}
.btn:hover{background:transparent;color:var(--cream)}
.btn-ghost{background:transparent;color:var(--cream)}
.btn-ghost:hover{background:var(--cream);color:var(--wine)}
.btn-ink{background:var(--wine);color:var(--cream);border-color:var(--wine)}
.btn-ink:hover{background:transparent;color:var(--wine)}
.hero{position:relative;min-height:92vh;display:grid;place-items:center;text-align:center;color:var(--cream);overflow:hidden}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.42)}
.hero-inner{position:relative;z-index:1;padding:80px 24px 64px;max-width:860px}
.eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.hero h1{font-family:"Cormorant Garamond",serif;font-size:clamp(72px,14vw,148px);font-weight:400;line-height:.82}
.hero h1 em{display:block;font-size:clamp(22px,3.4vw,36px);font-weight:400;margin-top:10px}
.hero p.lead{margin:22px auto 28px;max-width:520px;font-size:16px}
.hero-cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.hero-note{margin-top:18px;font-size:12px;opacity:.75}
.strip{display:grid;grid-template-columns:repeat(4,1fr);background:var(--wine-deep);color:var(--cream)}
.strip div{padding:18px 16px;text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;border-right:1px solid rgba(244,238,216,.08)}
.strip strong{display:block;font-family:"Cormorant Garamond",serif;font-size:22px;letter-spacing:0;text-transform:none;font-weight:500;margin-bottom:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px}
.sec{padding:88px 0}
.kicker{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--wine-soft);margin-bottom:10px}
h2{font-family:"Cormorant Garamond",serif;font-size:clamp(40px,6vw,68px);font-weight:400;line-height:.95;color:var(--wine);margin-bottom:16px}
.intro{max-width:560px;color:var(--muted);margin-bottom:36px}
.sig-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px}
.sig-main{min-height:560px;overflow:hidden}
.sig-main img,.card img{width:100%;height:100%;object-fit:cover}
.sig-side{display:grid;gap:16px}
.card{position:relative;min-height:270px;overflow:hidden;background:#2a1012;color:var(--cream)}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 20px;background:linear-gradient(transparent,rgba(20,6,8,.82))}
.card h3{font-family:"Cormorant Garamond",serif;font-size:32px;font-weight:400}
.card p{font-size:13px;opacity:.85;margin:4px 0 6px}
.card .price{color:var(--gold);font-size:14px}
.hist{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px}
.hist p{margin-bottom:14px;color:var(--muted)}
.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}
.room{background:var(--white)}
.room img{width:100%;height:210px;object-fit:cover}
.room div{padding:18px 18px 22px}
.room h3{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:500;color:var(--wine);margin-bottom:8px}
.room p{font-size:14px;color:var(--muted)}
.mosaic{display:grid;grid-template-columns:1.3fr 1fr 1fr;grid-template-rows:180px 180px;gap:12px;margin-top:16px}
.mosaic img{width:100%;height:100%;object-fit:cover}
.mosaic figure:first-child{grid-row:1/span 2}
.menu-sec{background:var(--wine);color:var(--cream);padding:88px 0 72px}
.menu-sec h2{color:var(--cream)}
.menu-sec .intro{color:rgba(244,238,216,.78)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 36px}
.tabs button{background:transparent;color:var(--cream);border:1px solid rgba(244,238,216,.28);padding:10px 14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.tabs button.on{background:var(--cream);color:var(--wine);border-color:var(--cream)}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 64px}
.col h3{font-family:"Cormorant Garamond",serif;font-size:32px;font-weight:400;margin-bottom:18px}
.dish{display:grid;grid-template-columns:1fr auto;gap:6px 20px;padding:14px 0;border-bottom:1px solid rgba(244,238,216,.16)}
.dish h4{font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:500}
.dish .desc{font-size:13px;opacity:.75}
.dish .price{font-family:"Cormorant Garamond",serif;font-size:20px;color:var(--gold)}
.tag{display:inline-block;margin-left:6px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;border:1px solid rgba(244,238,216,.35);border-radius:99px;padding:2px 6px}
.legend{margin-top:22px;font-size:12px;opacity:.65}
.panel{display:none}.panel.on{display:block}
.quotes{padding:88px 0}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}
.q{background:var(--white);padding:24px}
.stars{color:var(--wine);letter-spacing:2px;margin-bottom:10px}
.q p{font-family:"Cormorant Garamond",serif;font-size:20px;font-style:italic;line-height:1.35;margin-bottom:14px}
.q span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.reserve{display:grid;grid-template-columns:1fr 1fr;max-width:1120px;margin:0 auto 80px}
.reserve img{width:100%;height:100%;min-height:480px;object-fit:cover}
.reserve-form{background:var(--wine);color:var(--cream);padding:48px 40px}
.reserve-form h2{color:var(--cream)}
.reserve-form p{margin-bottom:22px;opacity:.85}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
input,textarea{width:100%;background:transparent;border:1px solid rgba(244,238,216,.28);color:var(--cream);padding:12px;font:14px Outfit,sans-serif}
input::placeholder,textarea::placeholder{color:rgba(244,238,216,.45)}
textarea{min-height:90px;margin-bottom:14px;resize:vertical}
.form-cta{display:flex;gap:10px;flex-wrap:wrap}
.visit{display:grid;grid-template-columns:.8fr 1.2fr;gap:40px}
.hours p{margin:8px 0;color:var(--muted)}
.hours strong{display:block;margin-top:14px;color:var(--ink)}
.map iframe{width:100%;height:380px;border:0;filter:grayscale(.3) contrast(1.05)}
footer{background:var(--wine-deep);color:var(--cream);padding:48px 28px 32px;text-align:center}
footer .word{font-size:40px;letter-spacing:.12em;font-family:"Cormorant Garamond",serif}
footer .meta{font-size:12px;letter-spacing:.18em;margin:8px 0 18px;opacity:.75}
footer .links{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
footer .copy{margin-top:22px;font-size:12px;opacity:.5}
.wa{position:fixed;right:20px;bottom:20px;z-index:60;width:54px;height:54px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:26px}
@media(max-width:900px){
.nav-links{display:none}
.strip,.sig-grid,.hist,.rooms,.menu-grid,.qgrid,.reserve,.visit,.row{grid-template-columns:1fr}
.mosaic{grid-template-columns:1fr 1fr;grid-template-rows:none}
.mosaic figure:first-child{grid-row:auto;height:280px}
.sig-main{min-height:320px}
.hero{min-height:86vh}
.reserve img{min-height:260px}
}
</style>
</head>

</body>
</html>
